<!doctype html>
<!-- Vigil demo film. A seek(t) film: every frame is a pure function of t. No CSS transitions, no timers, no state
     between frames, no Math.random. Shots are timed to the Kokoro narration (timeline.js, written by tts.py).
     Every product pixel is a real capture: assets/app (live app), assets/explorer (Mezo testnet explorer),
     assets/telegram (the user's phone recording of @VigilMezoBot). Sources for every number: BRIEF.md. -->
<html><head><meta charset="utf-8"><title>Vigil demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#05070B}canvas{display:block;max-width:100vw;max-height:100vh;margin:auto}</style>
</head><body>
<canvas id="c"></canvas>
<script src="lib/motion.js"></script>
<script src="timeline.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const TL = window.TIMELINE;
window.FILM = { w: W, h: H, dur: TL.dur, fps: 30 };
const L = layout(W, H), u = L.u;

// ---- Look: Vigil's brand (brand/, bot/src/web/app.html)
const C = { bg: '#0B0F17', panel: '#121826', line: '#253049', amber: '#F5A524', light: '#F4F1EA', text: '#E8ECF4', mute: '#A9B3C7', dim: '#6B7895', ink: '#14213D' };
const F = { display: '"Space Grotesk", Arial, sans-serif', ui: '"IBM Plex Sans", Arial, sans-serif', mono: '"JetBrains Mono", monospace' };

const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');

// ---- Assets (real captures only; a missing one renders as a red MISSING box)
const IMG = {};
function img(name, src) { const i = new Image(); i.src = src; IMG[name] = i; return i.decode().catch(() => { IMG[name] = null; console.warn('missing asset: ' + src); }); }
const SEQ = {};
function seq(name, dir, fps, frames) { SEQ[name] = { dir, fps, frames, cache: new Map() }; }
async function seqFrame(name, t) {
  const s = SEQ[name]; if (!s) return null;
  const n = Math.min(s.frames, Math.max(1, Math.floor(t * s.fps) + 1)), key = String(n).padStart(5, '0');
  if (!s.cache.has(key)) { const i = new Image(); i.src = `${s.dir}/${key}.jpg`; s.cache.set(key, i.decode().then(() => i, () => null)); if (s.cache.size > 90) s.cache.delete(s.cache.keys().next().value); }
  return s.cache.get(key);
}
seq('tg', 'assets/telegram/seq', 30, 552);          // 720x1624 phone recording, 18.4 s
window.ready = Promise.all([
  ...['500 100px', '700 100px'].map(w => document.fonts.load(`${w} ${F.display}`)),
  ...['400 100px', '500 100px', '600 100px'].map(w => document.fonts.load(`${w} ${F.ui}`)),
  ...['500 100px', '700 100px'].map(w => document.fonts.load(`${w} ${F.mono}`)),
  img('position', 'assets/app/position.png'), img('reserve', 'assets/app/reserve.png'), img('rescue', 'assets/app/rescue.png'),
  img('rtx', 'assets/explorer/rescue-tx/full-1920x1080.png'), img('rejA', 'assets/explorer/reject-above/screen-1920x1080.png'),
  img('rejB', 'assets/explorer/reject-tamper/screen-1920x1080.png'), img('contract', 'assets/explorer/contract/screen-1920x1080.png'),
]);

// ---- Helpers
const shot = id => TL.shots[id];
const line = id => TL.lines.find(l => l.id === id);
const at = (id, sid, plus = 0) => line(id).from - shot(sid).from + plus;     // local time of a narration line in its shot
function text(str, x, y, size, o = {}) {
  g.save(); g.font = `${o.weight || 500} ${size}px ${o.font || F.ui}`; g.fillStyle = o.color || C.text;
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic'; g.globalAlpha *= o.alpha ?? 1;
  if (o.track) g.letterSpacing = o.track + 'px';
  g.fillText(str, x, y); g.restore();
}
function wrap(str, maxW, size, font, weight) {
  g.save(); g.font = `${weight} ${size}px ${font}`; const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); g.restore(); return lines;
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
// Draw the source rect (fractions of the image) into a destination rect
function crop(name, fx, fy, fw, fh, x, y, w, h, r = 0) {
  const i = IMG[name]; g.save(); if (r) { rrect(x, y, w, h, r); g.clip(); }
  if (i) g.drawImage(i, fx * i.naturalWidth, fy * i.naturalHeight, fw * i.naturalWidth, fh * i.naturalHeight, x, y, w, h);
  else { g.fillStyle = '#FF3B30'; g.fillRect(x, y, w, h); text('MISSING ASSET: ' + name, x + 20, y + 60, 36, { weight: 700, color: '#fff' }); }
  g.restore();
}
// A camera over an image: show the window centred on (fx, fy) at zoom z (1 = whole width fits w) inside dest rect
function camera(name, fx, fy, z, x, y, w, h, r = 22) {
  const i = IMG[name]; if (!i) return crop(name, 0, 0, 1, 1, x, y, w, h, r);
  const aspect = (h / w) * (i.naturalWidth / i.naturalHeight);    // fraction of image height that fits at z = 1
  const fw = 1 / z, fh = Math.min(1, aspect / z);
  const sx = clamp(fx - fw / 2, 0, 1 - fw), sy = clamp(fy - fh / 2, 0, 1 - fh);
  crop(name, sx, sy, fw, fh, x, y, w, h, r);
  return { sx, sy, fw, fh, x, y, w, h };       // to map image fractions to screen for highlights
}
const toScreen = (v, fx, fy) => [v.x + (fx - v.sx) / v.fw * v.w, v.y + (fy - v.sy) / v.fh * v.h];
function ring(v, fx0, fy0, fx1, fy1, k, color = C.amber) {      // highlight a region of a camera view; k 0..1 draws it on
  if (k <= 0) return; const [x0, y0] = toScreen(v, fx0, fy0), [x1, y1] = toScreen(v, fx1, fy1), p = 10;
  g.save(); g.beginPath(); g.rect(v.x - 6, v.y - 6, v.w + 12, v.h + 12); g.clip(); g.strokeStyle = color; g.lineWidth = 5; g.globalAlpha = clamp(k * 1.4);
  rrect(x0 - p, y0 - p, (x1 - x0 + 2 * p) * (0.6 + 0.4 * easeOut(k)), y1 - y0 + 2 * p, 12); g.stroke(); g.restore();
}
function kicker(str, x, y, k = 1) { text(str.toUpperCase(), x, y + (1 - k) * 18, 24, { font: F.ui, weight: 600, color: C.amber, track: 3, alpha: clamp(k * 1.5) }); }
function heading(str, x, y, size, k = 1, color = C.text, maxW = 900) {
  wrap(str, maxW, size, F.display, 700).forEach((ln, i) => text(ln, x, y + i * size * 1.12 + (1 - k) * 30, size, { font: F.display, weight: 700, color, alpha: clamp(k * 1.4) }));
}
function pill(str, x, y, size, o = {}) {
  g.save(); g.font = `${o.weight || 600} ${size}px ${o.font || F.ui}`; const w = g.measureText(str).width + size * 1.4, h = size * 1.9;
  g.globalAlpha *= o.alpha ?? 1; g.fillStyle = o.bg || C.amber; rrect(o.align === 'center' ? x - w / 2 : x, y, w, h, h / 2); g.fill(); g.restore();
  text(str, (o.align === 'center' ? x - w / 2 : x) + size * 0.7, y + h * 0.66, size, { font: o.font || F.ui, weight: o.weight || 600, color: o.color || C.bg, alpha: o.alpha ?? 1 });
  return w;
}
function phone(im, cx, cy, h, zoom = 1, fx = .5, fy = .5) {      // the real recording inside a plain phone body
  const w = h * 720 / 1624, x = cx - w / 2, y = cy - h / 2, b = 14;
  g.save(); g.fillStyle = '#05070B'; rrect(x - b, y - b, w + 2 * b, h + 2 * b, 46); g.fill();
  g.strokeStyle = '#2A3550'; g.lineWidth = 2; g.stroke();
  rrect(x, y, w, h, 34); g.clip();
  if (im) { const sw = 720 / zoom, sh = 1624 / zoom, sx = clamp(fx * 720 - sw / 2, 0, 720 - sw), sy = clamp(fy * 1624 - sh / 2, 0, 1624 - sh);
    g.drawImage(im, sx, sy, sw, sh, x, y, w, h); }
  else { g.fillStyle = '#FF3B30'; g.fillRect(x, y, w, h); }
  g.restore(); return { x, y, w, h, zoom, fx, fy };
}
const phoneToScreen = (p, fx, fy) => { const sw = 1 / p.zoom, sx = clamp(p.fx - sw / 2, 0, 1 - sw), sy = clamp(p.fy - sw / 2, 0, 1 - sw);
  return [p.x + (fx - sx) / sw * p.w, p.y + (fy - sy) / sw * p.h]; };
function phoneRing(p, fx0, fy0, fx1, fy1, k) {
  if (k <= 0) return; const [x0, y0] = phoneToScreen(p, fx0, fy0), [x1, y1] = phoneToScreen(p, fx1, fy1);
  g.save(); g.strokeStyle = C.amber; g.lineWidth = 4; g.globalAlpha = clamp(k * 1.4); rrect(x0 - 6, y0 - 6, (x1 - x0 + 12) * (0.6 + 0.4 * easeOut(k)), y1 - y0 + 12, 10); g.stroke(); g.restore();
}
const pop = (lt, t0, sp = SPRINGS.base) => spring(lt - t0, ...sp);
function source(str, k = 1) { text(str, W - 120, 130, 21, { font: F.mono, weight: 500, color: C.dim, align: 'right', alpha: clamp(k) }); }

// ---- Captions: the narration, burned in, readable with the sound off
function captions(t) {
  const ln = TL.lines.find(l => t >= l.from - 0.05 && t < l.to + 0.3); if (!ln) return;
  const a = swapAlpha(t, ln.from - 0.12, ln.to + 0.3), size = 38, lines = wrap(ln.caption, 1500, size, F.ui, 600);
  const lh = size * 1.32, h = lines.length * lh + 30, y = H - 56 - h;
  g.save(); g.globalAlpha = a; g.fillStyle = 'rgba(5,7,11,0.86)'; rrect(L.cx - 820, y, 1640, h, 18); g.fill(); g.restore();
  lines.forEach((s, i) => text(s, L.cx, y + 15 + lh * (i + 0.74), size, { align: 'center', weight: 600, color: '#FFFFFF', alpha: a }));
}

// ---- Shots (READS listed per shot; lt = time inside the shot)

      const cx = lerp(L.cx, 600, pull), cy = lerp(450 - (0.745 - 0.5) * 1900, 470, pull);   // close-up on the alert card, then pull back
      phone(this.im, cx, cy, h);
      const k1 = pop(lt, 2.9), k2 = pop(lt, 3.25);

      heading('A warning before your Bitcoin is at risk.', 980, 470, 76, k2, C.text, 800);
    } },
  { id: 's02', draw(lt) {                      // reads: two ways to lose BTC → liquidation <110% → redemption, lowest ratio first → the dated stat

        const k = pop(lt, c.t), x = 120 + i * 850, y = 330 + (1 - k) * 60;

        if (!c.hot) { g.strokeStyle = C.line; g.lineWidth = 2; g.stroke(); } g.restore();
        text(`0${i + 1}`, x + 48, y + 80, 30, { font: F.mono, weight: 700, color: c.hot ? '#A85F00' : C.amber, alpha: clamp(k * 1.6) });
        text(c.title, x + 48, y + 160, 60, { font: F.display, weight: 700, color: c.hot ? C.ink : C.text, alpha: clamp(k * 1.6) });
        wrap(c.sub, 700, 32, F.ui, 500).forEach((s, j) => text(s, x + 48, y + 225 + j * 44, 32, { color: c.hot ? '#3B4A66' : C.mute, alpha: clamp(k * 1.6) }));
      });
      const ks = pop(lt, at('l04', 's02', 5.0));
      g.save(); g.globalAlpha = clamp(ks * 1.5); g.fillStyle = 'rgba(245,165,36,0.12)'; rrect(120, 690 + (1 - ks) * 30, 1660, 96, 18); g.fill(); g.restore();
      text('Mezo testnet, 15 Oct: the lowest-ratio loan was 1.1% from liquidation, and #1 of 244 in the redemption queue.', 150, 750 + (1 - ks) * 30, 28, { color: C.text, weight: 500, alpha: clamp(ks * 1.5) });
      source('Source: Vigil monitor read of trove 0xda04…aaaa, 2026-10-15', ks);
    } },
  { id: 's03', async load(lt) { this.im = await seqFrame('tg', clamp(8.0 + lt, 0, 18.3)); },
    draw(lt) {                                 // reads: send /watch → the card arrives → liquidation → queue → interest drift
      g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
      const card = lt >= 6.6, kz = pop(lt, 6.9, SPRINGS.heavy);
      const ph = lerp(800, 1480, kz), p = phone(this.im, 560, lerp(470, 470 - (0.80 - 0.5) * 1480, kz), ph);
      kicker('Telegram · @VigilMezoBot', 1040, 300, pop(lt, 0.2));
      heading('Send /watch with your Mezo address', 1040, 390, 60, pop(lt, 0.35), C.text, 760);
      const items = [
        { t: at('l06', 's03', 3.6), y0: .785, y1: .808, label: 'Liquidation price', val: '$60,563 · 26.3% away' },
        { t: at('l06', 's03', 5.4), y0: .808, y1: .858, label: 'Redemption queue', val: '#84 of 247' },
        { t: at('l06', 's03', 7.2), y0: .862, y1: .884, label: 'Interest drift', val: '12,999 days to 110%' },
      ];
      items.forEach((it, i) => {
        const k = card ? pop(lt, it.t, SPRINGS.snappy) : 0, nextT = items[i + 1] ? items[i + 1].t : 1e9;
        phoneRing(p, .045, it.y0, .86, it.y1, lt < nextT ? k : 0);
        text(it.label, 1040, 600 + i * 100 + (1 - k) * 16, 34, { font: F.display, weight: 700, color: C.text, alpha: clamp(k * 1.5) });
        text(it.val, 1040, 640 + i * 100 + (1 - k) * 16, 28, { font: F.mono, weight: 500, color: C.amber, alpha: clamp(k * 1.5) });
      });

    } },
  { id: 's04', draw(lt) {                      // reads: same data on the web → it is a real testnet loan (badge)
      g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
      kicker('Web app · vigil-mezo.up.railway.app', 120, 130, pop(lt, 0.1));
      const push = pop(lt, 0.2, SPRINGS.heavy), z = lerp(1.12, 1.22, seg(lt, 0, 8.5));
      const v = camera('position', .5, lerp(.31, .30, push), z, 120, 170, 1680, 700, 22);
      ring(v, .64, .04, .715, .0725, pop(lt, at('l07', 's04', 2.9), SPRINGS.snappy));
      ring(v, .344, .456, .656, .594, pop(lt, at('l07', 's04', 0.6), SPRINGS.snappy), 'rgba(245,165,36,0.7)');
    } },
  { id: 's05', draw(lt) {                      // reads: reserve → trigger → sign Mezo's message → Mezo checks it; EVM wallet only

        wrap('Test loan set up by script · rescue submitted by the live keeper', 510, 24, F.ui, 600).forEach((s, i) => text(s, x + 44, 740 + i * 34, 24, { color: C.amber, alpha: clamp(k * 1.5) }));

      ring(v, .565, .775, .98, .8, pop(lt, at('l13', 's08', 1.6), SPRINGS.snappy), '#2EA36B');
      const facts = [['No owner, no admin', at('l13', 's08', 0.4)], ['Source verified (exact match)', at('l13', 's08', 1.6)], ['12 / 12 fork tests vs Mezo’s contracts', at('l13', 's08', 3.2)]];
      facts.forEach(([s, t0], i) => { const k = pop(lt, t0, SPRINGS.snappy);
        g.save(); g.globalAlpha = clamp(k * 1.5); g.fillStyle = C.panel; rrect(1230, 230 + i * 190 + (1 - k) * 20, 570, 150, 20); g.fill(); g.strokeStyle = C.line; g.lineWidth = 2; g.stroke(); g.restore();

SHOTS.forEach(s => { s.from = TL.shots[s.id].from; s.to = TL.shots[s.id].to; });

// ---- Seams: one transition per pair, chosen for the story
const SEAMS = { s02: 'push', s03: 'iris', s04: 'push', s05: 'push', s06: 'iris', s07: 'push', s08: 'push', s09: 'iris' };
const IRIS_AT = { s03: [600, 520], s06: [1800, 760], s09: [L.cx, L.cy] };

async function paint(s, t) { if (s.load) await s.load(t - s.from); g.save(); s.draw(t - s.from); g.restore(); }
async function draw(t) {
  let i = SHOTS.findIndex(s => t >= s.from && t < s.to); if (i === -1) i = SHOTS.length - 1;
  const cur = SHOTS[i], next = SHOTS[i + 1], prev = SHOTS[i - 1];
  const win = 0.42;
  // transition window straddles the seam: [seam - win/2, seam + win/2]
  let a = null, b = null, k = 0, type = null;
  if (next && t > next.from - win / 2) { a = cur; b = next; k = seg(t, next.from - win / 2, next.from + win / 2); type = SEAMS[next.id]; }
  else if (prev && t < cur.from + win / 2) { a = prev; b = cur; k = seg(t, cur.from - win / 2, cur.from + win / 2); type = SEAMS[cur.id]; }
  if (!a) { await paint(cur, t); }
  else if (type === 'iris') {
    await paint(a, t); g.save(); const [x, y] = IRIS_AT[b.id]; g.beginPath(); g.arc(x, y, easeInOut(k) * Math.hypot(W, H), 0, Math.PI * 2); g.clip(); await paint(b, t); g.restore();
  } else {
    const e = easeInOut(k);
    g.save(); g.translate(-e * W * 0.35, 0); await paint(a, t); g.restore();
    g.save(); g.beginPath(); g.rect(W * (1 - e), 0, W * e + 1, H); g.clip(); g.translate(W * (1 - e) * 0.35, 0); await paint(b, t); g.restore();
  }
  captions(t);
}
window.seek = async t => { await window.ready; await draw(t); };

if (!Q.has('render')) {
  let t = 0, playing = true, last = performance.now();
  addEventListener('click', () => playing = !playing);
  addEventListener('keydown', e => { const d = e.shiftKey ? 1 : 1 / FILM.fps; if (e.key === 'ArrowRight') t += d; if (e.key === 'ArrowLeft') t -= d; t = loopT(t, FILM.dur); playing = false; });
  window.ready.then(async function loop(now = performance.now()) { if (playing) t = loopT(t + (now - last) / 1000, FILM.dur); last = now; await draw(t); document.title = t.toFixed(2); requestAnimationFrame(loop); });
}
